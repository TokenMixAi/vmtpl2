name: pw
on: workflow_dispatch
jobs:
  pw:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q playwright
      - run: python -m playwright install --with-deps chromium >/dev/null 2>&1
      - run: xvfb-run -a -s "-screen 0 1366x768x24" python pw_url.py
        env:
          PROBE_URL: ${{ secrets.PROBE_URL }}
